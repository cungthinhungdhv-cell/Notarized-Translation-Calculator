# Конфигурация цен на нотариальный перевод
# Все цены в VND (вьетнамских донгах)

pricing:
  # Минимальная цена за заказ
  minOrderPrice: 300000

  # Цена за один символ текста
  pricePerCharacter: 600

  # Считать ли пробелы как символы
  countSpaces: false

  # Цена за 1 дополнительную нотариальную копию перевода
  # (первая копия уже включена в стоимость перевода)
  notaryCopyTranslation: 70000

  # Цена за 1 нотариальную копию паспорта
  notaryCopyPassport: 70000

# Настройки OCR
ocr:
  # Языки для распознавания (документы на русском/английском)
  languages:
    - rus
    - eng

# Ограничения
limits:
  maxFileSizeMB: 50
  maxFilesAtOnce: 10

# UI настройки
ui:
  currency: "₫"
  locale: "ru-RU"
