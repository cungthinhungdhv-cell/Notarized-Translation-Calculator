# Конфигурация цен на нотариальный перевод
# Все цены в VND (вьетнамских донгах)

pricing:
  # Минимальная цена за заказ
  minOrderPrice: 2000000

  # Цена за один символ текста
  pricePerCharacter: 800

  # Считать ли пробелы как символы
  countSpaces: false

  # Цена за страницу копии нотариального перевода
  # (первая копия уже включена в стоимость перевода)
  notaryCopyTranslation: 100000

  # Цена за страницу нотариальной копии паспорта
  notaryCopyPassport: 100000

# Настройки OCR
ocr:
  # Языки для распознавания (документы на русском/английском)
  languages:
    - rus
    - eng

# Ограничения
limits:
  maxFileSizeMB: 50
  maxFilesAtOnce: 10

# UI настройки
ui:
  currency: "₫"
  locale: "ru-RU"
